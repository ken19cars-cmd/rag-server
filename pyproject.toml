[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-case-rag"
version = "0.1.0"
description = "Local RAG server for investment-promotion case analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pypdf>=5.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13", "pillow>=10.4"]
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.3"]

[project.scripts]
investment-case-rag = "rag_server.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_server = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
